name: paas-maven-deploy-snapshots

on:
  workflow_dispatch:
    inputs:
      SUPRAENVS:
        description: "Supraentornos destino (des/pre)"
        required: true
        type: string

      ENVS:
        description: "Entornos destino"
        required: true
        type: string

      PR_NUMBER:
        description: "Pull Request Number"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: lgomezs/order-processing
  REGISTRY: ${{ secrets.REGISTRY_URL }}

jobs:
  deploy-snapshot:
    name: Build & Publish Snapshot Image
    runs-on: ubuntu-latest

    if: contains(inputs.SUPRAENVS, 'des') || contains(inputs.SUPRAENVS, 'pre')

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print workflow inputs
        run: |
          echo "SUPRAENVS=${{ inputs.SUPRAENVS }}"
          echo "ENVS=${{ inputs.ENVS }}"
          echo "PR_NUMBER=${{ inputs.PR_NUMBER }}"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven installation
        run: mvn -version

      - name: Validate snapshot version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "Detected version: $VERSION"

          if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
            echo "ERROR: Este workflow solo soporta versiones SNAPSHOT"
            exit 1
          fi

      - name: Build Quarkus application
        run: mvn clean package -DskipTests

      - name: Validate Dockerfile.jvm exists
        run: |
          if [ ! -f src/main/docker/Dockerfile.jvm ]; then
            echo "ERROR: No existe src/main/docker/Dockerfile.jvm"
            exit 1
          fi

          echo "Dockerfile.jvm encontrado correctamente"

      - name: Build Docker image
        run: |
          docker build \
            -f src/main/docker/Dockerfile.jvm \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Login to DockerHub
        env:
          DP_USERNAME: ${{ secrets.DP_USERNAME }}
          DP_PASSWORD: ${{ secrets.DP_PASSWORD }}
        run: |
          echo "${DP_PASSWORD}" | docker login \
            -u "${DP_USERNAME}" \
            --password-stdin

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish Docker image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deployment summary
        run: |
          echo "Deploy snapshot completado"
          echo "SUPRAENVS=${{ inputs.SUPRAENVS }}"
          echo "ENVS=${{ inputs.ENVS }}"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Comment PR Success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.PR_NUMBER }}'),
              body: `
              ✅ Deploy completado correctamente

              Environment:
              - SUPRAENVS: ${{ inputs.SUPRAENVS }}
              - ENVS: ${{ inputs.ENVS }}

              Docker Image:
              \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`
              `
            })

      - name: Comment PR Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.PR_NUMBER }}'),
              body: `
              ❌ Deploy falló

              Revisar workflow:
              https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              `
            })